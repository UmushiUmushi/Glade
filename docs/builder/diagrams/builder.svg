<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" width="1140" height="760" font-family="Verdana, 'Atkinson Hyperlegible', Arial, sans-serif">
  <title>Item builder window layout</title>
  <defs>
    <style>
      .win { fill: #ffffff; stroke: #5b4bc4; stroke-width: 2; }
      .bar { fill: #ece8f8; }
      .pane { fill: #f4f1fb; stroke: #c9c2dd; stroke-width: 1.2; }
      .ic { fill: #ffffff; stroke: #8a80a8; stroke-width: 1.2; }
      .on { fill: #dcd3ff; stroke: #5b4bc4; stroke-width: 2; }
      .t { font-size: 13px; fill: #2b2640; }
      .s { font-size: 11px; fill: #2b2640; }
      .head { font-size: 12px; font-weight: bold; fill: #4b4370; letter-spacing: 1px; }
      .badge { fill: #e8590c; }
      .bt { font-size: 12px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1140" height="760" fill="#ffffff"/>
  <rect class="win" x="20" y="20" width="1100" height="720" rx="12"/>

  <!-- title bar -->
  <path d="M20 32 a12 12 0 0 1 12 -12 h1076 a12 12 0 0 1 12 12 v28 h-1100 z" class="bar"/>
  <text class="t" x="40" y="46" font-weight="bold">Item builder</text>
  <text class="t" x="150" y="46">· Lounge chair (not saved)</text>
  <rect class="ic" x="1006" y="27" width="30" height="26" rx="6"/><line x1="1014" y1="44" x2="1028" y2="44" stroke="#2b2640" stroke-width="2"/>
  <rect class="ic" x="1042" y="27" width="30" height="26" rx="6"/><rect x="1050" y="33" width="14" height="13" fill="none" stroke="#2b2640" stroke-width="2"/>
  <rect class="ic" x="1078" y="27" width="30" height="26" rx="6"/><path d="M1087 34 l12 12 M1099 34 l-12 12" stroke="#2b2640" stroke-width="2"/>

  <!-- templates -->
  <rect class="pane" x="20" y="60" width="190" height="680"/>
  <text class="head" x="34" y="86">TEMPLATES</text>
  <rect class="on" x="32" y="98" width="166" height="40" rx="8"/><text class="t" x="46" y="123">Other</text>
  <rect class="ic" x="32" y="144" width="166" height="40" rx="8"/><text class="t" x="46" y="169">Fence / hedge</text>
  <rect class="ic" x="32" y="190" width="166" height="40" rx="8"/><text class="t" x="46" y="215">House</text>
  <rect class="ic" x="32" y="236" width="166" height="40" rx="8"/><text class="t" x="46" y="261">Tree / plant</text>
  <rect class="ic" x="32" y="282" width="166" height="40" rx="8"/><text class="t" x="46" y="307">Bridge</text>
  <rect class="ic" x="32" y="328" width="166" height="40" rx="8"/><text class="t" x="46" y="353">Incline</text>
  <rect class="ic" x="32" y="374" width="166" height="40" rx="8"/><text class="t" x="46" y="399">Path tile</text>
  <rect class="ic" x="32" y="420" width="166" height="40" rx="8"/><text class="t" x="46" y="445">Lamp / light</text>
  <text class="s" x="34" y="490">Scroll for more</text>

  <!-- 3D viewport -->
  <rect x="210" y="60" width="910" height="680" fill="#eef4f8"/>
  <path d="M420 520 L640 420 L860 520 L640 620 Z" fill="#dfe9d8" stroke="#9fb796" stroke-width="1.5"/>
  <path d="M475 495 L695 595 M530 470 L750 570 M585 445 L805 545 M475 545 L695 445 M530 570 L750 470 M585 595 L805 495" stroke="#b9cbb1" stroke-width="1"/>
  <path d="M540 510 L640 465 L740 510 L640 555 Z" fill="none" stroke="#2f7df6" stroke-width="2.5" stroke-dasharray="6 3"/>
  <!-- the chair -->
  <path d="M560 470 L660 425 L720 452 L620 497 Z" fill="#a8774e" stroke="#6e4f36" stroke-width="1.5"/>
  <path d="M560 470 L620 497 L620 505 L560 478 Z" fill="#8a603e"/>
  <path d="M560 470 L560 400 L620 373 L620 443" fill="#b8865c" stroke="#6e4f36" stroke-width="1.5"/>
  <line x1="575" y1="478" x2="575" y2="525" stroke="#c0392b" stroke-width="5"/>
  <line x1="700" y1="460" x2="700" y2="505" stroke="#c0392b" stroke-width="5"/>
  <ellipse cx="650" cy="455" rx="55" ry="20" fill="#f2e2c4" stroke="#b8a07a" stroke-width="1.5"/>
  <text class="s" x="560" y="600">Footprint 1 × 2 tiles</text>

  <!-- file / undo / redo -->
  <rect class="ic" x="226" y="74" width="66" height="32" rx="7"/><text class="t" x="238" y="95">File ▾</text>
  <rect class="ic" x="298" y="74" width="60" height="32" rx="7"/><text class="t" x="308" y="95">Undo</text>
  <rect class="ic" x="364" y="74" width="60" height="32" rx="7"/><text class="t" x="374" y="95">Redo</text>

  <!-- connection preview button (fence template only) -->
  <rect class="ic" x="812" y="74" width="40" height="32" rx="7"/>
  <rect x="820" y="80" width="8" height="8" fill="#5b4bc4"/><rect x="830" y="80" width="8" height="8" fill="#5b4bc4"/><rect x="820" y="90" width="8" height="8" fill="#5b4bc4"/><rect x="830" y="90" width="8" height="8" fill="#5b4bc4"/>

  <!-- add panel -->
  <rect class="pane" x="864" y="70" width="244" height="430" rx="10"/>
  <text class="head" x="878" y="94">ADD</text>
  <rect class="ic" x="878" y="104" width="216" height="32" rx="8"/><text class="s" x="890" y="124">Search parts…</text>
  <text class="t" x="880" y="162" font-weight="bold">Bases</text>
  <rect class="ic" x="880" y="172" width="60" height="54" rx="6"/><rect class="ic" x="946" y="172" width="60" height="54" rx="6"/><rect class="ic" x="1012" y="172" width="60" height="54" rx="6"/>
  <text class="t" x="880" y="252" font-weight="bold">Legs</text>
  <rect class="ic" x="880" y="262" width="60" height="54" rx="6"/><rect class="ic" x="946" y="262" width="60" height="54" rx="6"/><rect class="ic" x="1012" y="262" width="60" height="54" rx="6"/>
  <text class="t" x="880" y="342" font-weight="bold">Toppings</text>
  <rect class="ic" x="880" y="352" width="60" height="54" rx="6"/><rect class="ic" x="946" y="352" width="60" height="54" rx="6"/><rect class="ic" x="1012" y="352" width="60" height="54" rx="6"/>
  <text class="s" x="880" y="432">Greenery · Decoration</text>
  <text class="s" x="880" y="450">Simple shapes</text>
  <text class="s" x="880" y="480">Click to add, or drag onto a surface.</text>

  <!-- edit tools -->
  <rect class="pane" x="226" y="650" width="560" height="74" rx="10"/>
  <text class="head" x="240" y="670">EDIT · Slab</text>
  <rect class="on" x="240" y="680" width="56" height="34" rx="7"/><text class="s" x="250" y="701">Move</text>
  <rect class="ic" x="300" y="680" width="62" height="34" rx="7"/><text class="s" x="308" y="701">Rotate</text>
  <rect class="ic" x="366" y="680" width="56" height="34" rx="7"/><text class="s" x="375" y="701">Scale</text>
  <rect class="ic" x="426" y="680" width="56" height="34" rx="7"/><text class="s" x="436" y="701">Paint</text>
  <rect class="ic" x="486" y="680" width="70" height="34" rx="7"/><text class="s" x="492" y="701">Bend 90°</text>
  <rect class="ic" x="560" y="680" width="70" height="34" rx="7"/><text class="s" x="566" y="701">Bend 60°</text>
  <rect class="ic" x="634" y="680" width="70" height="34" rx="7"/><text class="s" x="645" y="701">Delete</text>
  <rect class="ic" x="708" y="680" width="70" height="34" rx="7"/><text class="s" x="714" y="701">More ▾</text>

  <!-- problems -->
  <rect x="810" y="680" width="296" height="44" rx="10" fill="#e9f7ee" stroke="#2f9e44"/>
  <text class="t" x="826" y="707">No problems · 14 of 256 parts</text>

  <!-- badges -->
  <circle class="badge" cx="20" cy="20" r="11"/><text class="bt" x="16" y="25">1</text>
  <circle class="badge" cx="200" cy="86" r="11"/><text class="bt" x="196" y="91">2</text>
  <circle class="badge" cx="440" cy="90" r="11"/><text class="bt" x="436" y="95">3</text>
  <circle class="badge" cx="760" cy="420" r="11"/><text class="bt" x="756" y="425">4</text>
  <circle class="badge" cx="800" cy="90" r="11"/><text class="bt" x="796" y="95">5</text>
  <circle class="badge" cx="1108" cy="70" r="11"/><text class="bt" x="1104" y="75">6</text>
  <circle class="badge" cx="226" cy="650" r="11"/><text class="bt" x="222" y="655">7</text>
  <circle class="badge" cx="1106" cy="680" r="11"/><text class="bt" x="1102" y="685">8</text>
</svg>
