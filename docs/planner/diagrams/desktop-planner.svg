<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Verdana, 'Atkinson Hyperlegible', Arial, sans-serif">
  <title>Glade planner, desktop layout</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb7e8"/>
      <stop offset="1" stop-color="#f7d9a8"/>
    </linearGradient>
    <style>
      .panel { fill: #f4f1fb; stroke: #8a80a8; stroke-width: 1.5; }
      .sec { font-size: 12px; font-weight: bold; fill: #4b4370; letter-spacing: 1px; }
      .btn { fill: #ffffff; stroke: #8a80a8; stroke-width: 1.2; }
      .on { fill: #dcd3ff; stroke: #5b4bc4; stroke-width: 2; }
      .lbl { font-size: 12px; fill: #2b2640; }
      .sm { font-size: 10px; fill: #2b2640; }
      .div { stroke: #c9c2dd; stroke-width: 1.5; }
      .badge { fill: #e8590c; }
      .bt { font-size: 12px; font-weight: bold; fill: #ffffff; }
      .tb { fill: #fff9f0; stroke: #c9b48a; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #c9b48a; stroke-width: 1.2; }
      .thumb { fill: #efe6d6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <!-- ===== SIDE PANEL ===== -->
  <rect class="panel" x="0" y="0" width="300" height="800"/>
  <!-- header (pinned) -->
  <rect class="btn" x="16" y="14" width="40" height="36" rx="8"/>
  <circle cx="28" cy="32" r="2.5" fill="#2b2640"/><circle cx="36" cy="32" r="2.5" fill="#2b2640"/><circle cx="44" cy="32" r="2.5" fill="#2b2640"/>
  <rect class="btn" x="64" y="14" width="220" height="36" rx="8"/>
  <text x="78" y="38" font-size="17" font-weight="bold" fill="#3d7a3a" font-family="'Fredoka', 'Baloo 2', Verdana, sans-serif">Petit Planet</text>
  <path d="M262 28 l8 0 l-4 6 z" fill="#2b2640"/>
  <line class="div" x1="0" y1="64" x2="300" y2="64"/>

  <!-- cursor -->
  <text class="sec" x="16" y="88">CURSOR</text>
  <rect class="btn" x="16" y="98" width="64" height="40" rx="8"/>
  <text class="lbl" x="31" y="123">Hand</text>
  <rect class="on" x="88" y="98" width="64" height="40" rx="8"/>
  <text class="lbl" x="107" y="123">Pick</text>
  <line class="div" x1="0" y1="152" x2="300" y2="152"/>

  <!-- select -->
  <text class="sec" x="16" y="176">SELECT</text>
  <rect class="btn" x="16" y="186" width="38" height="36" rx="7"/><text class="sm" x="19" y="208">Lasso</text>
  <rect class="on" x="58" y="186" width="38" height="36" rx="7"/><text class="sm" x="63" y="208">Rect</text>
  <rect class="btn" x="100" y="186" width="38" height="36" rx="7"/><text class="sm" x="102" y="208">Circle</text>
  <rect class="btn" x="142" y="186" width="38" height="36" rx="7"/><text class="sm" x="144" y="208">Magic</text>
  <line x1="188" y1="186" x2="188" y2="222" stroke="#8a80a8" stroke-width="1.5"/>
  <rect class="on" x="196" y="186" width="30" height="36" rx="7"/><text class="sm" x="200" y="208">Set</text>
  <rect class="btn" x="228" y="186" width="30" height="36" rx="7"/><text class="sm" x="232" y="208">Add</text>
  <rect class="btn" x="260" y="186" width="30" height="36" rx="7"/><text class="sm" x="264" y="208">Sub</text>
  <rect class="btn" x="16" y="232" width="190" height="32" rx="7"/>
  <text class="lbl" x="56" y="253">Clear selection</text>
  <rect x="222" y="240" width="16" height="16" rx="3" fill="#5b4bc4"/>
  <path d="M225 248 l4 4 l7 -8" stroke="#fff" stroke-width="2" fill="none"/>
  <text class="lbl" x="244" y="253">Ruler</text>
  <line class="div" x1="0" y1="278" x2="300" y2="278"/>

  <!-- environment -->
  <text class="sec" x="16" y="302">ENVIRONMENT</text>
  <path d="M30 380 A70 70 0 0 1 170 380 Z" fill="url(#sky)" stroke="#8a80a8"/>
  <circle cx="47" cy="334" r="10" fill="#ffd34d" stroke="#e0a800"/>
  <line x1="30" y1="398" x2="170" y2="398" stroke="#8a80a8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="30" cy="398" r="3" fill="#4b4370"/><circle cx="80" cy="398" r="3" fill="#4b4370"/><circle cx="125" cy="398" r="3" fill="#4b4370"/><circle cx="170" cy="398" r="3" fill="#4b4370"/>
  <circle cx="62" cy="398" r="8" fill="#ffffff" stroke="#5b4bc4" stroke-width="2.5"/>
  <rect x="206" y="340" width="16" height="16" rx="3" fill="#ffffff" stroke="#8a80a8" stroke-width="1.5"/>
  <text class="lbl" x="228" y="353">Snow</text>
  <line class="div" x1="0" y1="418" x2="300" y2="418"/>

  <!-- layers -->
  <text class="sec" x="16" y="442">LAYERS</text>
  <g class="lbl">
    <ellipse cx="28" cy="465" rx="9" ry="5" fill="none" stroke="#2b2640" stroke-width="1.5"/><circle cx="28" cy="465" r="2" fill="#2b2640"/><text x="48" y="469">Houses</text>
    <ellipse cx="28" cy="495" rx="9" ry="5" fill="none" stroke="#2b2640" stroke-width="1.5"/><circle cx="28" cy="495" r="2" fill="#2b2640"/><text x="48" y="499">Furniture</text>
    <ellipse cx="28" cy="525" rx="9" ry="5" fill="none" stroke="#2b2640" stroke-width="1.5"/><circle cx="28" cy="525" r="2" fill="#2b2640"/><text x="48" y="529">Plants</text>
    <ellipse cx="28" cy="555" rx="9" ry="5" fill="none" stroke="#2b2640" stroke-width="1.5"/><circle cx="28" cy="555" r="2" fill="#2b2640"/><text x="48" y="559">Paths</text>
    <ellipse cx="28" cy="585" rx="9" ry="5" fill="none" stroke="#2b2640" stroke-width="1.5"/><circle cx="28" cy="585" r="2" fill="#2b2640"/><text x="48" y="589">Grid</text>
    <ellipse cx="28" cy="615" rx="9" ry="5" fill="none" stroke="#2b2640" stroke-width="1.5"/><circle cx="28" cy="615" r="2" fill="#2b2640"/><text x="48" y="619">Area</text>
  </g>
  <rect x="20" y="640" width="16" height="16" rx="3" fill="#5b4bc4"/><path d="M23 648 l4 4 l7 -8" stroke="#fff" stroke-width="2" fill="none"/>
  <text class="lbl" x="44" y="653">Always on: Area</text>
  <rect x="20" y="670" width="16" height="16" rx="3" fill="#5b4bc4"/><path d="M23 678 l4 4 l7 -8" stroke="#fff" stroke-width="2" fill="none"/>
  <text class="lbl" x="44" y="683">Always on: Grid</text>
  <line class="div" x1="0" y1="704" x2="300" y2="704"/>
  <rect class="btn" x="16" y="748" width="268" height="36" rx="8"/>
  <text class="lbl" x="88" y="771">Collapse panel  «</text>

  <!-- ===== VIEWPORT ===== -->
  <rect x="300" y="0" width="900" height="570" fill="#cfe8f2"/>
  <path d="M340 520 C 360 120, 1080 80, 1150 480 C 1100 560, 420 570, 340 520 Z" fill="#a9d79a" stroke="#7fb36d" stroke-width="2"/>
  <path d="M760 160 C 860 140, 980 180, 1000 260 C 940 300, 820 290, 760 240 Z" fill="#e4b3a8" stroke="#b77f74" stroke-width="2"/>
  <path d="M520 360 C 560 330, 640 340, 650 390 C 620 430, 540 430, 520 360 Z" fill="#9fd3d0" stroke="#5aa7a2" stroke-width="2"/>

  <!-- modes + undo/redo -->
  <rect class="on" x="316" y="14" width="92" height="34" rx="8"/><text class="lbl" x="328" y="36">Furniture</text>
  <rect class="btn" x="412" y="14" width="70" height="34" rx="8"/><text class="lbl" x="428" y="36">Paths</text>
  <rect class="btn" x="486" y="14" width="70" height="34" rx="8"/><text class="lbl" x="502" y="36">Cliffs</text>
  <rect class="btn" x="560" y="14" width="70" height="34" rx="8"/><text class="lbl" x="575" y="36">Water</text>
  <rect class="btn" x="642" y="14" width="56" height="34" rx="8"/><text class="lbl" x="654" y="36">Undo</text>
  <rect class="btn" x="702" y="14" width="56" height="34" rx="8"/><text class="lbl" x="714" y="36">Redo</text>

  <!-- pills -->
  <rect x="770" y="62" width="330" height="36" rx="18" fill="#fff4e5" stroke="#d9480f" stroke-width="1.5"/>
  <circle cx="790" cy="80" r="10" fill="#d9480f"/><text x="787" y="85" font-size="13" font-weight="bold" fill="#fff">!</text>
  <text class="lbl" x="808" y="85">Too steep: 4 levels (limit is 3)</text>
  <path d="M1052 77 l6 6 l6 -6" stroke="#2b2640" stroke-width="2" fill="none"/>
  <path d="M1076 74 l10 10 M1086 74 l-10 10" stroke="#2b2640" stroke-width="2"/>
  <rect x="788" y="94" width="200" height="3" fill="#d9480f"/>
  <rect x="770" y="104" width="330" height="36" rx="18" fill="#fff4e5" stroke="#d9480f" stroke-width="1.5" opacity="0.85"/>
  <circle cx="790" cy="122" r="10" fill="#d9480f"/><text x="787" y="127" font-size="13" font-weight="bold" fill="#fff">!</text>
  <text class="lbl" x="808" y="127">Items overlap</text>

  <!-- viewport menu -->
  <rect class="btn" x="1136" y="14" width="50" height="196" rx="10"/>
  <ellipse cx="1161" cy="38" rx="11" ry="6" fill="none" stroke="#2b2640" stroke-width="1.8"/><circle cx="1161" cy="38" r="2.5" fill="#2b2640"/>
  <line x1="1144" y1="58" x2="1178" y2="58" stroke="#c9c2dd"/>
  <text class="lbl" x="1149" y="84" font-weight="bold">3D</text>
  <rect class="on" x="1142" y="96" width="38" height="28" rx="6"/><text class="sm" x="1150" y="114">Iso</text>
  <line x1="1144" y1="134" x2="1178" y2="134" stroke="#c9c2dd"/>
  <text class="lbl" x="1149" y="160">Fit</text>
  <path d="M1155 190 l6 -6 l6 6" stroke="#2b2640" stroke-width="2" fill="none"/>

  <!-- selected item + quick actions -->
  <rect x="690" y="330" width="64" height="44" rx="4" fill="#c99a6b" stroke="#2f7df6" stroke-width="4"/>
  <circle cx="690" cy="300" r="14" fill="#ffffff" stroke="#2f7df6" stroke-width="1.5"/>
  <path d="M696 296 a7 7 0 1 0 0 8" stroke="#2b2640" stroke-width="2" fill="none"/>
  <circle cx="722" cy="300" r="14" fill="#ffffff" stroke="#2f7df6" stroke-width="1.5"/>
  <path d="M716 296 a7 7 0 1 1 0 8" stroke="#2b2640" stroke-width="2" fill="none"/>
  <circle cx="754" cy="300" r="14" fill="#ffffff" stroke="#2f7df6" stroke-width="1.5"/>
  <circle cx="748" cy="300" r="2" fill="#2b2640"/><circle cx="754" cy="300" r="2" fill="#2b2640"/><circle cx="760" cy="300" r="2" fill="#2b2640"/>
  <!-- hovered item -->
  <rect x="880" y="370" width="54" height="54" rx="4" fill="#8fbf6a" stroke="#f2b705" stroke-width="4"/>

  <!-- fps / coords -->
  <rect x="312" y="538" width="300" height="24" rx="6" fill="#ffffff" opacity="0.85"/>
  <text class="lbl" x="320" y="555">60 fps · Tile 34.5, 40 · Area C3</text>

  <!-- ===== TOOLBOX ===== -->
  <rect class="tb" x="300" y="570" width="900" height="230"/>
  <circle cx="330" cy="598" r="14" fill="#ffffff" stroke="#c9b48a" stroke-width="1.5"/>
  <circle cx="327" cy="595" r="6" fill="none" stroke="#2b2640" stroke-width="2"/><line x1="331" y1="600" x2="337" y2="606" stroke="#2b2640" stroke-width="2"/>
  <rect class="on" x="352" y="584" width="44" height="28" rx="6"/><text class="lbl" x="364" y="603">All</text>
  <text class="lbl" x="410" y="603">Houses</text>
  <text class="lbl" x="472" y="603">Seating</text>
  <text class="lbl" x="540" y="603">Tables</text>
  <text class="lbl" x="600" y="603">Lights</text>
  <text class="lbl" x="660" y="603">Plants</text>
  <text class="lbl" x="720" y="603">Fences</text>
  <text class="lbl" x="784" y="603">Bridges</text>
  <rect x="1060" y="582" width="124" height="34" rx="8" fill="#5b4bc4"/>
  <text x="1076" y="604" font-size="13" font-weight="bold" fill="#ffffff">+ New item</text>
  <g>
    <rect class="card" x="316" y="628" width="100" height="120" rx="8"/><rect class="thumb" x="324" y="636" width="84" height="76" rx="5"/><text class="sm" x="330" y="734">Chair</text>
    <rect class="card" x="426" y="628" width="100" height="120" rx="8" stroke="#2f7df6" stroke-width="3"/><rect class="thumb" x="434" y="636" width="84" height="76" rx="5"/><text class="sm" x="440" y="734">Lounge chair</text>
    <circle cx="512" cy="642" r="10" fill="#ffffff" stroke="#2f7df6"/><circle cx="507" cy="642" r="1.6" fill="#2b2640"/><circle cx="512" cy="642" r="1.6" fill="#2b2640"/><circle cx="517" cy="642" r="1.6" fill="#2b2640"/>
    <rect class="card" x="536" y="628" width="100" height="120" rx="8"/><rect class="thumb" x="544" y="636" width="84" height="76" rx="5"/><text class="sm" x="550" y="734">Bench</text>
    <rect class="card" x="646" y="628" width="100" height="120" rx="8"/><rect class="thumb" x="654" y="636" width="84" height="76" rx="5"/><text class="sm" x="660" y="734">Street lamp</text>
    <rect class="card" x="756" y="628" width="100" height="120" rx="8"/><rect class="thumb" x="764" y="636" width="84" height="76" rx="5"/><text class="sm" x="770" y="734">Small table</text>
    <rect class="card" x="866" y="628" width="100" height="120" rx="8"/><rect class="thumb" x="874" y="636" width="84" height="76" rx="5"/><text class="sm" x="880" y="734">Fountain</text>
    <rect class="card" x="976" y="628" width="100" height="120" rx="8"/><rect class="thumb" x="984" y="636" width="84" height="76" rx="5"/><text class="sm" x="990" y="734">Hedge</text>
  </g>

  <!-- ===== NUMBER BADGES ===== -->
  <g>
    <circle class="badge" cx="10" cy="10" r="10"/><text class="bt" x="6" y="15">1</text>
    <circle class="badge" cx="290" cy="12" r="10"/><text class="bt" x="286" y="17">2</text>
    <circle class="badge" cx="166" cy="118" r="10"/><text class="bt" x="162" y="123">3</text>
    <circle class="badge" cx="100" cy="170" r="10"/><text class="bt" x="96" y="175">4</text>
    <circle class="badge" cx="150" cy="296" r="10"/><text class="bt" x="146" y="301">5</text>
    <circle class="badge" cx="100" cy="436" r="10"/><text class="bt" x="96" y="441">6</text>
    <circle class="badge" cx="270" cy="732" r="10"/><text class="bt" x="266" y="737">7</text>
    <circle class="badge" cx="316" cy="62" r="10"/><text class="bt" x="312" y="67">8</text>
    <circle class="badge" cx="700" cy="62" r="10"/><text class="bt" x="696" y="67">9</text>
    <circle class="badge" cx="1112" cy="80" r="10"/><text class="bt" x="1108" y="85">10</text>
    <circle class="badge" cx="1120" cy="224" r="10"/><text class="bt" x="1112" y="229">11</text>
    <circle class="badge" cx="672" cy="352" r="10"/><text class="bt" x="666" y="357">12</text>
    <circle class="badge" cx="950" cy="370" r="10"/><text class="bt" x="944" y="375">13</text>
    <circle class="badge" cx="626" cy="550" r="10"/><text class="bt" x="620" y="555">14</text>
    <circle class="badge" cx="850" cy="598" r="10"/><text class="bt" x="844" y="603">15</text>
    <circle class="badge" cx="1046" cy="598" r="10"/><text class="bt" x="1040" y="603">16</text>
    <circle class="badge" cx="1092" cy="690" r="10"/><text class="bt" x="1086" y="695">17</text>
  </g>
</svg>
