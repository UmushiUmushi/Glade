<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Verdana, 'Atkinson Hyperlegible', Arial, sans-serif">
  <title>Viewport details: violation pills, selection actions menu, viewport menu</title>
  <defs>
    <style>
      .cap { font-size: 16px; font-weight: bold; fill: #2b2640; }
      .t { font-size: 13px; fill: #2b2640; }
      .s { font-size: 11px; fill: #2b2640; }
      .note { font-size: 12px; fill: #5a536f; }
      .ic { fill: #ffffff; stroke: #8a80a8; stroke-width: 1.2; }
      .on { fill: #dcd3ff; stroke: #5b4bc4; stroke-width: 2; }
      .menu { fill: #ffffff; stroke: #8a80a8; stroke-width: 1.5; }
      .pill { fill: #fff4e5; stroke: #d9480f; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- ===== A: pills ===== -->
  <text class="cap" x="20" y="30">A. Violation pill</text>
  <rect class="pill" x="20" y="48" width="440" height="42" rx="21"/>
  <circle cx="44" cy="69" r="12" fill="#d9480f"/><text x="40" y="75" font-size="15" font-weight="bold" fill="#fff">!</text>
  <text class="t" x="66" y="74">Too steep: 4 levels (limit is 3)</text>
  <path d="M398 65 l7 7 l7 -7" stroke="#2b2640" stroke-width="2" fill="none"/>
  <path d="M428 62 l12 12 M440 62 l-12 12" stroke="#2b2640" stroke-width="2"/>
  <rect x="42" y="85" width="260" height="3" fill="#d9480f"/>
  <text class="note" x="20" y="110">icon + short title · timer bar · expand · close</text>

  <text class="cap" x="20" y="150">Expanded</text>
  <rect class="pill" x="20" y="164" width="440" height="190" rx="21"/>
  <circle cx="44" cy="185" r="12" fill="#d9480f"/><text x="40" y="191" font-size="15" font-weight="bold" fill="#fff">!</text>
  <text class="t" x="66" y="190">Too steep: 4 levels (limit is 3)</text>
  <path d="M398 188 l7 -7 l7 7" stroke="#2b2640" stroke-width="2" fill="none"/>
  <path d="M428 178 l12 12 M440 178 l-12 12" stroke="#2b2640" stroke-width="2"/>
  <text class="s" x="44" y="222">Land next to each other can only differ by 3 levels.</text>
  <text class="s" x="44" y="242">Where: 6 blocks around Block 52, 31 (Area D3)</text>
  <text class="s" x="44" y="262">Fix tip: lower the cliff, or add a step in between.</text>
  <text class="s" x="44" y="282">Rule T3 · step-limit</text>
  <rect class="ic" x="44" y="298" width="100" height="32" rx="8"/><text class="s" x="62" y="319">Show me</text>
  <rect class="ic" x="152" y="298" width="110" height="32" rx="8"/><text class="s" x="168" y="319">Learn more</text>
  <rect class="ic" x="270" y="298" width="110" height="32" rx="8"/><text class="s" x="282" y="319">Report issue</text>
  <text class="note" x="20" y="378">Timer pauses while expanded, hovered or focused.</text>
  <text class="note" x="20" y="396">Max 3 pills on screen. More wait in a queue: "+2 more".</text>

  <!-- ===== B: selection menu ===== -->
  <text class="cap" x="500" y="30">B. Selection actions menu (Cliffs mode)</text>
  <rect x="500" y="48" width="380" height="330" fill="#cfe8f2"/>
  <path d="M540 140 C 600 90, 720 100, 760 160 C 760 230, 600 250, 540 200 Z" fill="#e4b3a8" stroke="#b77f74" stroke-width="2"/>
  <rect x="530" y="96" width="250" height="150" fill="none" stroke="#2f7df6" stroke-width="3" stroke-dasharray="8 4"/>
  <circle cx="780" cy="246" r="12" fill="#ffffff" stroke="#2f7df6" stroke-width="2"/>
  <circle cx="774" cy="246" r="2" fill="#2b2640"/><circle cx="780" cy="246" r="2" fill="#2b2640"/><circle cx="786" cy="246" r="2" fill="#2b2640"/>
  <rect class="menu" x="690" y="262" width="180" height="108" rx="10"/>
  <text class="s" x="702" y="280" font-weight="bold">Selection</text>
  <path d="M852 271 l8 8 M860 271 l-8 8" stroke="#2b2640" stroke-width="1.8"/>
  <text class="s" x="702" y="300">Raise / lower</text>
  <text class="s" x="702" y="318">Copy · Paste</text>
  <text class="s" x="702" y="336">Delete (flatten)</text>
  <line x1="700" y1="344" x2="862" y2="344" stroke="#e0dcea"/>
  <text class="s" x="702" y="362">Select ground too</text>
  <!-- raise/lower slider -->
  <rect class="menu" x="896" y="60" width="64" height="210" rx="10"/>
  <text class="s" x="906" y="80">Raise</text>
  <line x1="928" y1="92" x2="928" y2="238" stroke="#8a80a8" stroke-width="4" stroke-linecap="round"/>
  <line x1="916" y1="165" x2="940" y2="165" stroke="#4b4370" stroke-width="2"/>
  <text class="s" x="944" y="169">0</text>
  <circle cx="928" cy="140" r="9" fill="#ffffff" stroke="#5b4bc4" stroke-width="2.5"/>
  <text class="s" x="904" y="258">Lower</text>
  <text class="note" x="500" y="400">Menu opens by itself after a selection, next to the cursor.</text>
  <text class="note" x="500" y="418">It hangs off the ••• button at the selection corner nearest the cursor.</text>
  <text class="note" x="500" y="436">X closes it. Clicking ••• (or right click / long press) opens it again.</text>
  <text class="note" x="896" y="290">Slider snaps to 0.</text>
  <text class="note" x="896" y="306">+1 per notch.</text>

  <!-- ===== C: viewport menu ===== -->
  <text class="cap" x="20" y="460">C. Viewport menu</text>
  <rect class="ic" x="20" y="478" width="52" height="150" rx="10"/>
  <ellipse cx="46" cy="500" rx="11" ry="6" fill="none" stroke="#2b2640" stroke-width="1.8"/><circle cx="46" cy="500" r="2.5" fill="#2b2640"/>
  <text class="t" x="34" y="538" font-weight="bold">3D</text>
  <rect class="on" x="26" y="550" width="40" height="28" rx="6"/><text class="s" x="35" y="569">Iso</text>
  <text class="t" x="34" y="604">Fit</text>
  <path d="M40 620 l6 -6 l6 6" stroke="#2b2640" stroke-width="2" fill="none"/>
  <text class="note" x="84" y="504">Preview (hides all HUD)</text>
  <text class="note" x="84" y="538">2D / 3D switch</text>
  <text class="note" x="84" y="568">View mode (only in 3D)</text>
  <text class="note" x="84" y="604">Fit camera</text>

  <rect class="menu" x="260" y="540" width="190" height="44" rx="10"/>
  <rect class="on" x="268" y="548" width="54" height="28" rx="6"/><text class="s" x="282" y="567">Iso</text>
  <rect class="ic" x="326" y="548" width="54" height="28" rx="6"/><text class="s" x="338" y="567">Top</text>
  <rect class="ic" x="384" y="548" width="58" height="28" rx="6"/><text class="s" x="394" y="567">Walk</text>
  <line x1="236" y1="562" x2="260" y2="562" stroke="#9a93b5" stroke-dasharray="3 3"/>

  <text class="cap" x="520" y="480">Collapsed</text>
  <rect class="ic" x="560" y="490" width="14" height="96" rx="5"/>
  <path d="M570 532 l-5 6 l5 6" stroke="#2b2640" stroke-width="2" fill="none"/>
  <text class="note" x="586" y="542">Slim tag, same height. Chevron points left. Click to open.</text>

  <text class="cap" x="520" y="610">Preview mode: only a closed-eye button stays, top right.</text>
</svg>
