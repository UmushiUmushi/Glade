<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 860" width="1290" height="860" font-family="Verdana, 'Atkinson Hyperlegible', Arial, sans-serif">
  <title>Glade planner on a phone: portrait and landscape</title>
  <defs>
    <style>
      .phone { fill: #222031; }
      .bar { fill: #f4f1fb; stroke: #8a80a8; stroke-width: 1; }
      .ic { fill: #ffffff; stroke: #8a80a8; stroke-width: 1.2; }
      .on { fill: #dcd3ff; stroke: #5b4bc4; stroke-width: 2; }
      .t { font-size: 10px; fill: #2b2640; }
      .tiny { font-size: 9px; fill: #2b2640; }
      .cap { font-size: 15px; font-weight: bold; fill: #2b2640; }
      .sheet { fill: #fff9f0; stroke: #c9b48a; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #c9b48a; stroke-width: 1.2; }
      .badge { fill: #e8590c; }
      .bt { font-size: 12px; font-weight: bold; fill: #ffffff; }
    </style>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#f4f1fb" stop-opacity="0"/>
      <stop offset="1" stop-color="#f4f1fb" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1290" height="860" fill="#ffffff"/>

  <!-- ================= PORTRAIT ================= -->
  <text class="cap" x="140" y="20">Phone, portrait</text>
  <rect class="phone" x="20" y="30" width="390" height="810" rx="40"/>
  <rect x="30" y="40" width="370" height="790" rx="32" fill="#cfe8f2"/>
  <path d="M40 700 C 40 200, 390 160, 392 640 Z" fill="#a9d79a" stroke="#7fb36d" stroke-width="2"/>
  <!-- top bar -->
  <rect class="bar" x="30" y="40" width="370" height="52" rx="0"/>
  <rect class="ic" x="38" y="48" width="36" height="36" rx="8"/><text class="t" x="48" y="70">•••</text>
  <rect class="ic" x="78" y="48" width="36" height="36" rx="8"/><text x="84" y="71" font-size="13" font-weight="bold" fill="#3d7a3a">PP</text>
  <line x1="120" y1="50" x2="120" y2="82" stroke="#8a80a8" stroke-width="1.5"/>
  <rect class="on" x="126" y="48" width="36" height="36" rx="8"/><text class="tiny" x="132" y="70">Pick</text>
  <rect class="on" x="166" y="48" width="36" height="36" rx="8"/><text class="tiny" x="171" y="70">Rect</text>
  <rect class="ic" x="206" y="48" width="36" height="36" rx="8"/><text class="tiny" x="210" y="70">Clear</text>
  <rect class="on" x="246" y="48" width="36" height="36" rx="8"/><text class="tiny" x="249" y="70">Ruler</text>
  <rect class="ic" x="286" y="48" width="36" height="36" rx="8"/><circle cx="304" cy="66" r="8" fill="#ffd34d" stroke="#e0a800"/>
  <rect class="ic" x="326" y="48" width="36" height="36" rx="8"/><text class="tiny" x="331" y="70">Snow</text>
  <rect class="on" x="366" y="48" width="36" height="36" rx="8"/>
  <rect x="340" y="41" width="60" height="50" fill="url(#fade)"/>
  <text class="tiny" x="36" y="106">60 fps · Tile 34, 40</text>
  <!-- modes, vertical left -->
  <rect class="on" x="38" y="124" width="46" height="46" rx="10"/><text class="tiny" x="43" y="151">Furn.</text>
  <rect class="ic" x="38" y="176" width="46" height="46" rx="10"/><text class="tiny" x="44" y="203">Paths</text>
  <rect class="ic" x="38" y="228" width="46" height="46" rx="10"/><text class="tiny" x="44" y="255">Cliffs</text>
  <rect class="ic" x="38" y="280" width="46" height="46" rx="10"/><text class="tiny" x="44" y="307">Water</text>
  <!-- viewport menu right + undo/redo -->
  <rect class="ic" x="346" y="120" width="46" height="168" rx="10"/>
  <ellipse cx="369" cy="142" rx="11" ry="6" fill="none" stroke="#2b2640" stroke-width="1.8"/><circle cx="369" cy="142" r="2.5" fill="#2b2640"/>
  <text class="t" x="360" y="180" font-weight="bold">3D</text>
  <text class="t" x="361" y="218">Iso</text>
  <text class="t" x="361" y="256">Fit</text>
  <path d="M363 278 l6 -6 l6 6" stroke="#2b2640" stroke-width="2" fill="none"/>
  <rect class="ic" x="346" y="298" width="46" height="40" rx="10"/><text class="tiny" x="352" y="322">Undo</text>
  <rect class="ic" x="346" y="344" width="46" height="40" rx="10"/><text class="tiny" x="352" y="368">Redo</text>
  <!-- bottom sheet toolbox -->
  <rect class="sheet" x="30" y="600" width="370" height="230" rx="22"/>
  <rect x="190" y="610" width="50" height="5" rx="3" fill="#b5a27a"/>
  <circle cx="54" cy="638" r="13" fill="#ffffff" stroke="#c9b48a"/>
  <circle cx="51" cy="635" r="5" fill="none" stroke="#2b2640" stroke-width="2"/><line x1="55" y1="639" x2="60" y2="644" stroke="#2b2640" stroke-width="2"/>
  <rect class="on" x="74" y="626" width="36" height="24" rx="6"/><text class="t" x="82" y="642">All</text>
  <text class="t" x="118" y="642">Houses</text><text class="t" x="166" y="642">Seating</text><text class="t" x="220" y="642">Tables</text><text class="t" x="268" y="642">Lights</text>
  <rect x="344" y="624" width="48" height="28" rx="7" fill="#5b4bc4"/><text x="357" y="643" font-size="14" font-weight="bold" fill="#fff">+</text>
  <rect class="card" x="40" y="662" width="80" height="76" rx="8"/><rect class="card" x="128" y="662" width="80" height="76" rx="8"/><rect class="card" x="216" y="662" width="80" height="76" rx="8"/><rect class="card" x="304" y="662" width="80" height="76" rx="8"/>
  <rect class="card" x="40" y="746" width="80" height="76" rx="8"/><rect class="card" x="128" y="746" width="80" height="76" rx="8"/><rect class="card" x="216" y="746" width="80" height="76" rx="8"/><rect class="card" x="304" y="746" width="80" height="76" rx="8"/>

  <!-- badges portrait -->
  <circle class="badge" cx="24" cy="66" r="10"/><text class="bt" x="20" y="71">1</text>
  <circle class="badge" cx="24" cy="104" r="10"/><text class="bt" x="20" y="109">2</text>
  <circle class="badge" cx="24" cy="150" r="10"/><text class="bt" x="20" y="155">3</text>
  <circle class="badge" cx="408" cy="200" r="10"/><text class="bt" x="404" y="205">4</text>
  <circle class="badge" cx="408" cy="340" r="10"/><text class="bt" x="404" y="345">5</text>
  <circle class="badge" cx="408" cy="612" r="10"/><text class="bt" x="404" y="617">6</text>

  <!-- ================= LANDSCAPE ================= -->
  <text class="cap" x="760" y="20">Phone, landscape</text>
  <rect class="phone" x="440" y="30" width="830" height="410" rx="40"/>
  <rect x="452" y="40" width="806" height="390" rx="32" fill="#cfe8f2"/>
  <path d="M480 420 C 520 120, 1180 100, 1230 400 Z" fill="#a9d79a" stroke="#7fb36d" stroke-width="2"/>
  <rect class="bar" x="452" y="40" width="806" height="46"/>
  <rect class="ic" x="470" y="46" width="34" height="34" rx="8"/><text class="t" x="479" y="67">•••</text>
  <rect class="ic" x="508" y="46" width="34" height="34" rx="8"/><text x="513" y="68" font-size="12" font-weight="bold" fill="#3d7a3a">PP</text>
  <line x1="550" y1="48" x2="550" y2="78" stroke="#8a80a8" stroke-width="1.5"/>
  <g>
    <rect class="on" x="556" y="46" width="34" height="34" rx="8"/><rect class="on" x="594" y="46" width="34" height="34" rx="8"/><rect class="ic" x="632" y="46" width="34" height="34" rx="8"/><rect class="on" x="670" y="46" width="34" height="34" rx="8"/>
    <rect class="ic" x="708" y="46" width="34" height="34" rx="8"/><rect class="ic" x="746" y="46" width="34" height="34" rx="8"/><rect class="on" x="784" y="46" width="34" height="34" rx="8"/><rect class="on" x="822" y="46" width="34" height="34" rx="8"/>
    <rect class="ic" x="860" y="46" width="34" height="34" rx="8"/><rect class="on" x="898" y="46" width="34" height="34" rx="8"/><rect class="on" x="936" y="46" width="34" height="34" rx="8"/><rect class="on" x="974" y="46" width="34" height="34" rx="8"/>
  </g>
  <text class="tiny" x="462" y="100">60 fps · Tile 34, 40</text>
  <rect class="on" x="462" y="110" width="40" height="40" rx="9"/><rect class="ic" x="462" y="156" width="40" height="40" rx="9"/><rect class="ic" x="462" y="202" width="40" height="40" rx="9"/><rect class="ic" x="462" y="248" width="40" height="40" rx="9"/>
  <rect class="ic" x="1206" y="96" width="42" height="150" rx="10"/>
  <rect class="ic" x="1206" y="252" width="42" height="34" rx="9"/><rect class="ic" x="1206" y="290" width="42" height="34" rx="9"/>
  <rect class="sheet" x="560" y="370" width="590" height="60" rx="18"/>
  <rect x="830" y="378" width="50" height="5" rx="3" fill="#b5a27a"/>
  <text class="t" x="580" y="410">Toolbox (collapsed: tap or drag the handle up to open)</text>

  <!-- explanation box -->
  <rect x="440" y="470" width="830" height="370" rx="14" fill="#f8f7fc" stroke="#c9c2dd"/>
  <text class="cap" x="460" y="500">Key</text>
  <g font-size="14" fill="#2b2640">
    <text x="460" y="530">1  Top bar. More menu and game picker stay pinned on the left.</text>
    <text x="460" y="554">    The rest of the bar scrolls sideways. It has the same icons as the desktop rail.</text>
    <text x="460" y="584">2  Tiny FPS counter and coordinates, under the top bar.</text>
    <text x="460" y="614">3  Viewport modes, stacked down the left edge.</text>
    <text x="460" y="644">4  Viewport menu on the right. It can still collapse into a slim tag.</text>
    <text x="460" y="674">5  Undo and Redo, under the viewport menu.</text>
    <text x="460" y="704">6  Toolbox as a bottom sheet over the viewport. It can collapse.</text>
    <text x="460" y="740">Tap replaces hover: tap an icon to see its name and its flyout.</text>
    <text x="460" y="766">Long press opens the actions menu for a selection or item.</text>
    <text x="460" y="792">Settings let the user lock the layout to portrait or landscape.</text>
  </g>
</svg>
