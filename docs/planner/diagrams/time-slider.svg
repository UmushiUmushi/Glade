<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Verdana, 'Atkinson Hyperlegible', Arial, sans-serif">
  <title>Time of day control: sun arc above a snapping slider</title>
  <defs>
    <linearGradient id="skyA" x1="0" x2="1">
      <stop offset="0" stop-color="#f6c9a0"/>
      <stop offset="0.35" stop-color="#7cb7e8"/>
      <stop offset="0.68" stop-color="#f3b27a"/>
      <stop offset="1" stop-color="#1d2a5a"/>
    </linearGradient>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <path d="M100 220 A180 180 0 0 1 460 220 Z" fill="url(#skyA)" stroke="#8a80a8" stroke-width="1.5"/>
  <!-- key points on arc: t=0, .357, .678, 1 ; angle = 180 - 180t -->
  <circle cx="100" cy="220" r="6" fill="#4b4370"/>
  <circle cx="202" cy="58" r="6" fill="#4b4370"/>
  <circle cx="376" cy="68" r="6" fill="#4b4370"/>
  <circle cx="460" cy="220" r="6" fill="#4b4370"/>
  <!-- sun at ~ t=0.25 -->
  <circle cx="153" cy="93" r="18" fill="#ffd34d" stroke="#e0a800" stroke-width="2"/>
  <!-- slider -->
  <line x1="100" y1="262" x2="460" y2="262" stroke="#8a80a8" stroke-width="6" stroke-linecap="round"/>
  <g fill="#4b4370">
    <circle cx="100" cy="262" r="5"/><circle cx="229" cy="262" r="5"/><circle cx="344" cy="262" r="5"/><circle cx="460" cy="262" r="5"/>
  </g>
  <circle cx="190" cy="262" r="12" fill="#ffffff" stroke="#5b4bc4" stroke-width="3"/>
  <g font-size="13" fill="#2b2640">
    <text x="62" y="292">Morning</text><text x="76" y="310">7:00</text>
    <text x="200" y="292">Midday</text><text x="208" y="310">12:00</text>
    <text x="308" y="292">Afternoon</text><text x="324" y="310">16:30</text>
    <text x="436" y="292">Night</text><text x="438" y="310">21:00</text>
  </g>
  <g font-size="13" fill="#2b2640">
    <text x="510" y="60" font-weight="bold">How it works</text>
    <text x="510" y="88">• 4 key points come from the</text>
    <text x="510" y="106">   look: presets with an hour.</text>
    <text x="510" y="132">• Dragging near a key point</text>
    <text x="510" y="150">   snaps to it (magnet zone).</text>
    <text x="510" y="176">• Let go between points and it</text>
    <text x="510" y="194">   stays there: the look blends.</text>
    <text x="510" y="220">• Sun moves on the arc. After</text>
    <text x="510" y="238">   the afternoon it turns into a moon.</text>
    <text x="510" y="264">• Sky colours are read from the</text>
    <text x="510" y="282">   game's own look at that hour.</text>
  </g>
</svg>
